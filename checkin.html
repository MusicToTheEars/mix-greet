<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Door · Mix &amp; Greet</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0B0D">
<link rel="stylesheet" href="/brand.css">
<style>
/* ============================================================
   /checkin — the door screen. Built for an iPad held in one hand
   in a dark room, so: dark throughout (a white flash at the door
   is hostile), one enormous verdict panel readable at arm's
   length, and no interaction required for the common case.

   Two input paths, both always live:
     camera      — BarcodeDetector on the video stream
     HID scanner — a Bluetooth gun types the code + Enter, which a
                   permanently refocused hidden input catches
   ============================================================ */
body{background:var(--bg);color:var(--ink);overscroll-behavior:none}
.wrap{max-width:1100px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 0;border-bottom:2px solid var(--line);flex-wrap:wrap}
.bar .who{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.bar select{width:auto;min-width:230px;background:var(--panel);border-color:var(--line);color:var(--ink)}

/* live counters */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line);
  border:2px solid var(--line);margin-top:18px}
.stat{background:var(--panel);padding:14px 16px}
.stat .n{font-family:'Big Shoulders',Impact,sans-serif;font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1}
.stat .l{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.stat.in .n{color:var(--green)} .stat.exp .n{color:var(--ink)} .stat.wait .n{color:var(--amber)}

.deck{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;margin-top:20px}
@media(max-width:820px){.deck{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}

#cam{width:100%;aspect-ratio:3/4;object-fit:cover;background:#000;border:2px solid var(--line);display:block}
.camwrap{position:relative}
.camwrap .reticle{position:absolute;inset:14% 10%;border:2px solid rgba(236,28,36,.85);pointer-events:none}
.camnote{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:8px}

/* the verdict panel: one state, unmissable */
.verdict{border:2px solid var(--line);background:var(--panel);min-height:340px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
.verdict .big{font-family:'Big Shoulders',Impact,sans-serif;font-weight:800;text-transform:uppercase;
  font-size:clamp(38px,9vw,86px);line-height:.92}
.verdict .nm{font-size:clamp(16px,2.4vw,22px);letter-spacing:.06em;margin-top:10px;color:var(--ink)}
.verdict .sub{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.verdict.idle{border-style:dashed}
.verdict.idle .big{color:var(--muted);font-size:clamp(22px,4vw,34px)}
.verdict.in{border-color:var(--green)}      .verdict.in .big{color:var(--green)}
.verdict.already{border-color:var(--amber)} .verdict.already .big{color:var(--amber)}
.verdict.bad{border-color:var(--red)}       .verdict.bad .big{color:var(--red)}
.verdict .undo{margin-top:18px}

/* the HID capture field is real and focused, just not something to look at */
#hid{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.manual{margin-top:16px;display:flex;gap:8px}
.manual input{flex:1}
.log{margin-top:18px;font-size:12px;max-height:190px;overflow:auto;border-top:2px solid var(--line)}
.log div{padding:7px 0;border-bottom:1px solid var(--line);color:var(--muted);letter-spacing:.04em}
.log b{color:var(--ink);font-weight:700}
</style>
</head>
<body>

<input id="hid" autocomplete="off" aria-hidden="true" tabindex="-1">

<main class="wrap">

  <div class="panel accent" id="gate" style="margin-top:22px">
    <h2>Door access</h2>
    <label for="pass">Password</label>
    <input type="password" id="pass" autocomplete="current-password">
    <button class="btn" id="enter" type="button">Open the door</button>
    <p class="msg err" id="gate-msg" hidden>Wrong password.</p>
  </div>

  <div id="door" hidden>
    <div class="bar">
      <span class="who">Mix &amp; Greet · Door</span>
      <select id="ev" aria-label="Event"></select>
    </div>

    <div class="stats">
      <div class="stat in"><div class="n" id="s-in">0</div><div class="l">Checked in</div></div>
      <div class="stat exp"><div class="n" id="s-exp">0</div><div class="l">Still expected</div></div>
      <div class="stat wait"><div class="n" id="s-wait">0</div><div class="l">Waitlist</div></div>
    </div>

    <div class="deck">
      <div>
        <div class="camwrap">
          <video id="cam" playsinline muted></video>
          <div class="reticle"></div>
        </div>
        <p class="camnote" id="camnote">Starting camera…</p>
        <div class="manual">
          <input id="manual" placeholder="Type or scan a code" autocomplete="off">
          <button class="btn" id="go" type="button" style="margin-top:0">Check in</button>
        </div>
        <div class="log" id="log"></div>
      </div>

      <div class="verdict idle" id="verdict">
        <div class="big" id="v-big">Ready to scan</div>
        <div class="nm" id="v-nm"></div>
        <div class="sub" id="v-sub">Point the camera at a pass, or pull the trigger on a scanner</div>
        <button class="btn ghost undo" id="undo" type="button" hidden>Undo this check-in</button>
      </div>
    </div>
  </div>
</main>

<script>
const API = 'https://good-labrador-980.convex.site';
const $ = id => document.getElementById(id);
let TOKEN = sessionStorage.getItem('mg_token') || '';
let EVENTS = [], LAST = null, busy = false;

/* ---------- auth ---------- */
async function login(pw){
  const m = $('gate-msg'); m.hidden = true;
  try {
    const r = await fetch(API + '/api/admin/login', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ password: pw })
    });
    if (!r.ok) { m.textContent = r.status === 429
      ? 'Too many attempts. Wait a few minutes.' : 'Wrong password.'; m.hidden = false; return; }
    TOKEN = (await r.json()).token;
    sessionStorage.setItem('mg_token', TOKEN);
    open_();
  } catch(_) { m.textContent = 'Could not reach the door service.'; m.hidden = false; }
}
$('enter').addEventListener('click', () => login($('pass').value));
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') login($('pass').value); });

async function api(path, opts){
  const r = await fetch(API + path, Object.assign({
    headers: { 'content-type':'application/json', 'x-admin-token': TOKEN }
  }, opts || {}));
  if (r.status === 401) { sessionStorage.removeItem('mg_token'); location.reload(); throw new Error('auth'); }
  return r.json();
}

/* ---------- events + counters ---------- */
async function loadEvents(){
  const list = await api('/api/events', { method:'POST', body: JSON.stringify({ action:'list' }) });
  EVENTS = (list.published || []);
  const sel = $('ev'); sel.textContent = '';
  EVENTS.forEach(e => {
    const o = document.createElement('option');
    o.value = e.slug || e.id; o.textContent = e.date + ' · ' + e.title;
    sel.appendChild(o);
  });
  // Default to the next event that has not happened yet — at a door, that is
  // always the one being run.
  const today = new Date().toISOString().slice(0,10);
  const next = EVENTS.find(e => e.date >= today);
  if (next) sel.value = next.slug || next.id;
  refresh();
}
$('ev').addEventListener('change', refresh);

async function refresh(){
  const key = $('ev').value; if (!key) return;
  try {
    const d = await api('/api/admin/door?eventId=' + encodeURIComponent(key));
    $('s-in').textContent = d.checkedIn;
    $('s-exp').textContent = Math.max(0, d.confirmed);
    $('s-wait').textContent = d.waitlist;
  } catch(_) {}
}

/* ---------- the scan ---------- */
function verdict(cls, big, nm, sub, canUndo){
  const v = $('verdict');
  v.className = 'verdict ' + cls;
  $('v-big').textContent = big;
  $('v-nm').textContent = nm || '';
  $('v-sub').textContent = sub || '';
  $('undo').hidden = !canUndo;
  if (navigator.vibrate) navigator.vibrate(cls === 'in' ? 40 : cls === 'bad' ? [60,50,60] : 25);
}

function logLine(name, what){
  const d = document.createElement('div');
  const t = new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
  d.innerHTML = '<b>' + (name || '—') + '</b> · ' + what + ' · ' + t;
  $('log').prepend(d);
}

async function scan(code, undo){
  code = String(code || '').trim();
  if (!code || busy) return;
  busy = true;
  try {
    const r = await api('/api/admin/checkin', {
      method:'POST', body: JSON.stringify({ code, undo: !!undo })
    });
    if (r.error) { verdict('bad', 'Not recognised', '', 'That code is not a pass for any RSVP'); logLine('', 'unrecognised'); }
    else if (r.state === 'in')          { LAST = code; verdict('in', 'Welcome in', r.name, party(r.guests), true); logLine(r.name, 'checked in'); }
    else if (r.state === 'waitlist_in') { LAST = code; verdict('in', 'In — was waitlisted', r.name, party(r.guests), true); logLine(r.name, 'in (waitlist)'); }
    else if (r.state === 'already')     { LAST = code; verdict('already', 'Already in', r.name, 'Scanned earlier at ' + fmt(r.at), true); logLine(r.name, 'duplicate scan'); }
    else if (r.state === 'cancelled')   { LAST = null; verdict('bad', 'Cancelled', r.name, 'This RSVP was cancelled'); logLine(r.name, 'cancelled'); }
    else if (r.state === 'undone')      { LAST = null; verdict('idle', 'Check-in undone', r.name, 'They can be scanned again'); logLine(r.name, 'undone'); }
    refresh();
  } catch(_) {
    verdict('bad', 'Door offline', '', 'Could not reach the service — try again');
  } finally {
    // Brief lockout so one trigger pull cannot fire three times.
    setTimeout(() => { busy = false; }, 900);
  }
}
const party = n => (n > 1 ? n + ' guests' : 'Just them');
const fmt = s => { try { return new Date(s).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); } catch(_) { return ''; } };

$('undo').addEventListener('click', () => { if (LAST) scan(LAST, true); });
$('go').addEventListener('click', () => { scan($('manual').value); $('manual').value=''; });
$('manual').addEventListener('keydown', e => { if (e.key==='Enter'){ scan($('manual').value); $('manual').value=''; }});

/* ---------- Bluetooth / HID scanners ----------
   A scanner gun in keyboard mode types the payload then Enter. Keeping a hidden
   input focused means that works with no UI at all, which is what staff want
   when the room is full. Focus is restored on any stray tap. */
const hid = $('hid');
function grab(){ if (document.activeElement !== $('manual')) hid.focus({preventScroll:true}); }
document.addEventListener('click', grab);
document.addEventListener('visibilitychange', () => { if (!document.hidden) grab(); });
setInterval(grab, 1500);
hid.addEventListener('keydown', e => {
  if (e.key === 'Enter') { scan(hid.value); hid.value = ''; e.preventDefault(); }
});

/* ---------- camera ----------
   BarcodeDetector is native in Safari 17+ and Chrome, so no library ships here.
   Where it is missing the camera is simply not offered and the scanner and
   manual field carry the door. */
async function camera(){
  const note = $('camnote');
  if (!('BarcodeDetector' in window)) {
    note.textContent = 'Camera scanning unavailable on this browser — use a scanner or type the code';
    $('cam').style.display = 'none';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false
    });
    const v = $('cam'); v.srcObject = stream; await v.play();
    note.textContent = 'Camera live — hold a pass in the frame';
    const det = new window.BarcodeDetector({ formats: ['qr_code'] });
    const tick = async () => {
      if (!document.hidden && v.readyState >= 2 && !busy) {
        try {
          const hits = await det.detect(v);
          if (hits && hits.length) scan(hits[0].rawValue);
        } catch(_) {}
      }
      setTimeout(tick, 320);
    };
    tick();
  } catch (err) {
    note.textContent = 'Camera blocked — allow access, or use a scanner / type the code';
    $('cam').style.display = 'none';
  }
}

function open_(){
  $('gate').hidden = true;
  $('door').hidden = false;
  loadEvents();
  camera();
  grab();
  setInterval(refresh, 20000);
}
if (TOKEN) open_();
</script>
</body>
</html>
