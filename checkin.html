<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Check In · Mix &amp; Greet</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0B0D">
<link rel="stylesheet" href="/brand.css">
<style>
/* ============================================================
   /checkin — one job: scan a pass, say yes or no.

   Someone working a door is holding an iPad in one hand and a
   guest is waiting. So there is nothing on screen but the camera
   and a frame to aim at, and the answer arrives as a full-screen
   colour anyone can read at arm's length without stopping to
   parse it. Counts, logs and manual entry were noise at the door
   and are gone; the back office already has the numbers.
   ============================================================ */
html,body{height:100%}
body{background:var(--bg);color:var(--ink);overscroll-behavior:none}

/* ---------- setup: pick the event, start ---------- */
.setup{max-width:520px;margin:0 auto;padding:clamp(24px,6vh,64px) 20px}
.setup .lede{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.setup select{margin-top:6px}
.setup .btn{width:100%;text-align:center;margin-top:22px;padding:18px}

/* ---------- scanner: the whole screen ---------- */
#scanner{position:fixed;inset:0;background:#000;display:none}
#scanner.on{display:block}
#cam{width:100%;height:100%;object-fit:cover;display:block}

/* the aiming frame: four corner brackets, the same device the site
   uses on its photo panels, so the guest sees a target not a box */
.guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(66vw,300px);aspect-ratio:1;pointer-events:none}
.guide i{position:absolute;width:38px;height:38px;border:4px solid var(--brand)}
.guide i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.guide i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.guide i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.guide i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.hint{position:absolute;left:0;right:0;top:calc(50% + min(33vw,150px) + 26px);text-align:center;
  font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:rgba(237,234,227,.82);
  text-shadow:0 1px 6px rgba(0,0,0,.9);padding:0 20px;pointer-events:none}
/* everything outside the frame dimmed, so the eye goes to the target */
.mask{position:absolute;inset:0;background:rgba(6,6,8,.52);pointer-events:none}

.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;
  justify-content:space-between;gap:12px;padding:14px 16px;
  background:linear-gradient(180deg,rgba(6,6,8,.86),rgba(6,6,8,0));pointer-events:none}
.topbar .ev{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);
  text-shadow:0 1px 6px rgba(0,0,0,.9);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar button{pointer-events:auto;background:none;border:2px solid rgba(237,234,227,.5);
  color:var(--ink);padding:8px 14px;font-size:11px;letter-spacing:.18em}

/* ---------- the verdict: the whole screen, one colour ---------- */
#verdict{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:28px;z-index:5}
#verdict.on{display:flex}
#verdict.in{background:#0E2A1A}
#verdict.already{background:#2E2408}
#verdict.bad{background:#2A0B0D}
#verdict .mark{width:104px;height:104px;border:6px solid currentColor;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:56px;line-height:1}
#verdict.in .mark,#verdict.in .big{color:var(--green)}
#verdict.already .mark,#verdict.already .big{color:var(--amber)}
#verdict.bad .mark,#verdict.bad .big{color:var(--red)}
#verdict .big{font-family:'Big Shoulders',Impact,sans-serif;font-weight:800;text-transform:uppercase;
  font-size:clamp(44px,11vw,92px);line-height:.92;margin-top:22px}
#verdict .nm{font-size:clamp(17px,3.4vw,26px);letter-spacing:.05em;color:var(--ink);margin-top:10px}
#verdict .sub{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:14px}

#hid{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
</style>
</head>
<body>

<input id="hid" autocomplete="off" aria-hidden="true" tabindex="-1">

<!-- 1. door staff sign in -->
<main class="wrap narrow" id="gateWrap">
  <div class="panel accent" id="gate" style="margin-top:12vh">
    <h2>Door access</h2>
    <label for="pass">Password</label>
    <input type="password" id="pass" autocomplete="current-password">
    <button class="btn" id="enter" type="button">Continue</button>
    <p class="msg err" id="gate-msg" hidden>Wrong password.</p>
  </div>
</main>

<!-- 2. pick the event, start -->
<main class="setup hidden" id="setup">
  <h1 class="masthead" style="font-size:clamp(34px,8vw,52px)">Check&nbsp;In</h1>
  <p class="lede">Pick tonight's event, then start scanning</p>
  <label for="ev">Event</label>
  <select id="ev"></select>
  <button class="btn" id="start" type="button">Start check-in</button>
  <p class="msg err" id="setup-msg" hidden></p>
</main>

<!-- 3. the scanner -->
<div id="scanner">
  <video id="cam" playsinline muted autoplay></video>
  <div class="mask"></div>
  <div class="guide"><i></i><i></i><i></i><i></i></div>
  <p class="hint" id="hint">Hold the QR code in the frame</p>
  <div class="topbar">
    <span class="ev" id="evName"></span>
    <button id="stop" type="button">Done</button>
  </div>
</div>

<!-- 4. the answer -->
<div id="verdict">
  <div class="mark" id="v-mark">✓</div>
  <div class="big" id="v-big"></div>
  <div class="nm" id="v-nm"></div>
  <div class="sub" id="v-sub"></div>
</div>

<script>
const API = 'https://good-labrador-980.convex.site';
const $ = id => document.getElementById(id);
let TOKEN = sessionStorage.getItem('mg_token') || '';
let EVENTS = [], busy = false, stream = null, ticking = false;

/* ---------- sign in ---------- */
async function login(pw){
  const m = $('gate-msg'); m.hidden = true;
  try {
    const r = await fetch(API + '/api/admin/login', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ password: pw })
    });
    if (!r.ok) {
      m.textContent = r.status === 429 ? 'Too many attempts. Wait a few minutes.' : 'Wrong password.';
      m.hidden = false; return;
    }
    TOKEN = (await r.json()).token;
    sessionStorage.setItem('mg_token', TOKEN);
    toSetup();
  } catch(_) { m.textContent = 'Could not reach the door service.'; m.hidden = false; }
}
$('enter').addEventListener('click', () => login($('pass').value));
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') login($('pass').value); });

async function api(path, opts){
  const r = await fetch(API + path, Object.assign({
    headers: { 'content-type':'application/json', 'x-admin-token': TOKEN }
  }, opts || {}));
  if (r.status === 401) { sessionStorage.removeItem('mg_token'); location.reload(); throw new Error('auth'); }
  return r.json();
}

/* ---------- pick the event ---------- */
async function toSetup(){
  $('gateWrap').classList.add('hidden');
  $('setup').classList.remove('hidden');
  try {
    const list = await api('/api/events', { method:'POST', body: JSON.stringify({ action:'list' }) });
    EVENTS = list.published || [];
    const sel = $('ev'); sel.textContent = '';
    EVENTS.forEach(e => {
      const o = document.createElement('option');
      o.value = e.slug || e.id;
      o.textContent = e.date + ' · ' + e.title;
      sel.appendChild(o);
    });
    // Default to the soonest event that has not passed — at a door that is
    // always the one being run.
    const today = new Date().toISOString().slice(0,10);
    const next = EVENTS.find(e => e.date >= today);
    if (next) sel.value = next.slug || next.id;
    if (!EVENTS.length) {
      $('setup-msg').textContent = 'No published events to check in to.';
      $('setup-msg').hidden = false;
      $('start').disabled = true;
    }
  } catch(_) {
    $('setup-msg').textContent = 'Could not load events.';
    $('setup-msg').hidden = false;
  }
}
$('start').addEventListener('click', startScanning);

/* ---------- scan ---------- */
async function startScanning(){
  const sel = $('ev');
  $('evName').textContent = sel.options[sel.selectedIndex]?.textContent || '';
  $('setup').classList.add('hidden');
  $('scanner').classList.add('on');
  grab();
  // Keep the screen awake: a door session is long and a sleeping iPad mid-queue
  // is the fastest way to lose the room.
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(_) {}
  await camera();
}

$('stop').addEventListener('click', () => {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  ticking = false;
  $('scanner').classList.remove('on');
  $('setup').classList.remove('hidden');
});

async function camera(){
  if (!('BarcodeDetector' in window)) {
    $('hint').textContent = 'This browser cannot scan — use a Bluetooth scanner';
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    });
    const v = $('cam');
    v.srcObject = stream;
    await v.play();
    const det = new window.BarcodeDetector({ formats: ['qr_code'] });
    ticking = true;
    const tick = async () => {
      if (!ticking) return;
      if (!document.hidden && v.readyState >= 2 && !busy) {
        try {
          const hits = await det.detect(v);
          if (hits && hits.length) scan(hits[0].rawValue);
        } catch(_) {}
      }
      setTimeout(tick, 300);
    };
    tick();
  } catch(_) {
    $('hint').textContent = 'Camera blocked — allow access in Settings, or use a scanner';
  }
}

/* ---------- the answer ---------- */
let hideTimer = null;
function verdict(cls, mark, big, nm, sub){
  const v = $('verdict');
  v.className = 'on ' + cls;
  $('v-mark').textContent = mark;
  $('v-big').textContent = big;
  $('v-nm').textContent = nm || '';
  $('v-sub').textContent = sub || '';
  if (navigator.vibrate) navigator.vibrate(cls === 'in' ? 40 : cls === 'bad' ? [60,50,60] : 25);
  clearTimeout(hideTimer);
  // Clears itself: nobody at a door should have to tap to get back to scanning.
  hideTimer = setTimeout(() => { v.className = ''; }, cls === 'in' ? 2200 : 3000);
}

async function scan(code){
  code = String(code || '').trim();
  if (!code || busy) return;
  busy = true;
  try {
    const r = await api('/api/admin/checkin', {
      method:'POST', body: JSON.stringify({ code })
    });
    if (r.error)                        verdict('bad','✕','Not valid','', 'That code is not a pass for this event');
    else if (r.state === 'in')          verdict('in','✓','Checked in', r.name, party(r.guests));
    else if (r.state === 'waitlist_in') verdict('in','✓','Checked in', r.name, 'Was on the waitlist · ' + party(r.guests));
    else if (r.state === 'already')     verdict('already','!','Already in', r.name, 'Scanned earlier');
    else if (r.state === 'cancelled')   verdict('bad','✕','Cancelled', r.name, 'This RSVP was cancelled');
  } catch(_) {
    verdict('bad','✕','Offline','', 'Could not reach the service');
  } finally {
    // One pass, one check-in: a QR sits in frame for many frames, and a scanner
    // trigger repeats. Without this pause a single guest fires several times.
    setTimeout(() => { busy = false; }, 2400);
  }
}
const party = n => (n > 1 ? n + ' guests' : 'Just them');

/* ---------- Bluetooth / HID scanners ----------
   A scanner gun in keyboard mode types the payload then Enter, so a hidden
   focused input picks it up with no UI at all. */
const hid = $('hid');
function grab(){ hid.focus({ preventScroll: true }); }
document.addEventListener('click', grab);
document.addEventListener('visibilitychange', () => { if (!document.hidden) grab(); });
setInterval(() => { if ($('scanner').classList.contains('on')) grab(); }, 1500);
hid.addEventListener('keydown', e => {
  if (e.key === 'Enter') { scan(hid.value); hid.value = ''; e.preventDefault(); }
});

if (TOKEN) toSetup();
</script>
</body>
</html>
